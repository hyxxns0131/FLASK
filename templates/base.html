<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🕵️ 명탐정 코난 추리 아카이브 | Detective Conan Game</title>
    <!-- 공통 메인 스타일시트 -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- 페이지별 추가 스타일시트 -->
    {% block extra_css %}{% endblock %}
</head>
<body>
    <header class="global-header">
        <div class="header-inner">
            <a href="/" class="brand-logo">
                <span class="brand-icon">🔍</span>
                <span class="brand-text">CONAN MYSTERY ARCHIVE</span>
            </a>
            <div class="header-nav">
                <span class="nav-tag">포인트 앤 클릭 추리 어드벤처</span>
                <a href="/" class="btn-nav-home">사건 목록</a>
            </div>
        </div>
    </header>

    <main class="main-wrapper">
        {% block content %}{% endblock %}
    </main>

    <footer class="global-footer">
        <div class="footer-inner">
            <p>© 2026 Detective Mystery Game | 진실은 언제나 단 하나!</p>
        </div>
    </footer>
</body>
</html>
